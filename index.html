<!-- Firebase SDK + Lógica do Rateio em Tempo Real -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
      onSnapshot, query, orderBy, runTransaction, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbgu58V1xIGd8gIA6cEapnAczxu9qFcr4",
      authDomain: "rateio-63ed4.firebaseapp.com",
      projectId: "rateio-63ed4",
      storageBucket: "rateio-63ed4.firebasestorage.app",
      messagingSenderId: "228099568947",
      appId: "1:228099568947:web:5adfaa4fad85439f9a3a46",
      measurementId: "G-22CXGK8YTJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let products = [];
    let reservations = [];
    let storeConfig = { pixKey: "", storeWhatsapp: "", adminPass: "admin123" };

    const formatBRL = (val) => Number(val || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    // Funções de Interface e Admin registradas imediatamente
    window.openAdminModal = () => document.getElementById("adminModal").classList.remove("hidden");
    window.closeAdminModal = () => document.getElementById("adminModal").classList.add("hidden");

    window.loginAdmin = function () {
      const pass = document.getElementById("adminPasswordInput").value;
      if (pass === (storeConfig.adminPass || "admin123")) {
        document.getElementById("adminLoginView").classList.add("hidden");
        document.getElementById("adminDashboardView").classList.remove("hidden");
      } else {
        alert("Senha incorreta!");
      }
    };

    window.switchAdminTab = function (tab) {
      document.querySelectorAll(".admin-tab").forEach(el => {
        el.classList.remove("border-blue-500", "text-blue-400");
        el.classList.add("border-transparent", "text-slate-400");
      });
      document.getElementById(`tab-${tab}`).classList.add("border-blue-500", "text-blue-400");
      document.getElementById(`tab-${tab}`).classList.remove("border-transparent", "text-slate-400");

      ["closings", "products", "bulk", "settings"].forEach(v => {
        document.getElementById(`view-${v}`).classList.toggle("hidden", v !== tab);
      });
    };

    // Escutar Configurações
    onSnapshot(doc(db, "config", "store"), (snap) => {
      if (snap.exists()) {
        storeConfig = { ...storeConfig, ...snap.data() };
        document.getElementById("settingPixKey").value = storeConfig.pixKey || "";
        document.getElementById("settingStoreWhatsapp").value = storeConfig.storeWhatsapp || "";
      }
    });

    // Escutar Produtos em Tempo Real
    onSnapshot(collection(db, "products"), (snapshot) => {
      products = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      document.getElementById("loadingState").classList.add("hidden");
      updateCategoryDropdown();
      renderCatalog();
      renderAdminProducts();
      renderAdminClosings();
    }, (err) => {
      console.error("Erro Firestore:", err);
      document.getElementById("loadingState").innerHTML = `<p class="text-red-400 text-sm">Erro ao conectar ao banco de dados. Verifique as Regras do Firestore.</p>`;
    });

    // Escutar Reservas em Tempo Real
    onSnapshot(query(collection(db, "reservations"), orderBy("createdAtMs", "asc")), (snapshot) => {
      reservations = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderCatalog();
      renderAdminClosings();
    });

    function getBatchReservations(productId, batchNumber) {
      return reservations
        .filter(r => r.productId === productId && (r.batch || 1) === (batchNumber || 1))
        .slice(0, 10);
    }

    function updateCategoryDropdown() {
      const select = document.getElementById("categoryFilter");
      const current = select.value;
      const cats = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
      select.innerHTML = `<option value="ALL">Todas as Categorias (${products.length})</option>` +
        cats.map(c => `<option value="${c}">${c}</option>`).join("");
      if (cats.includes(current)) select.value = current;
    }

    window.renderCatalog = function () {
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      const cat = document.getElementById("categoryFilter").value;
      const status = document.getElementById("statusFilter").value;
      const grid = document.getElementById("productsGrid");
      const empty = document.getElementById("emptyState");

      const filtered = products.filter(p => {
        const batch = p.currentBatch || 1;
        const count = getBatchReservations(p.id, batch).length;
        const isClosed = count >= 10;
        if (search && !p.name.toLowerCase().includes(search)) return false;
        if (cat !== "ALL" && p.category !== cat) return false;
        if (status === "OPEN" && isClosed) return false;
        if (status === "CLOSED" && !isClosed) return false;
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");

      grid.innerHTML = filtered.map(p => {
        const batch = p.currentBatch || 1;
        const batchRes = getBatchReservations(p.id, batch);
        const count = batchRes.length;
        const isClosed = count >= 10;
        const pct = Math.min(100, (count / 10) * 100);
        const imgUrl = p.image || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80";

        return `
          <div class="bg-slate-900 border ${isClosed ? 'border-emerald-500/40' : 'border-slate-800'} rounded-2xl overflow-hidden flex flex-col shadow-lg">
            <div class="relative h-44 bg-slate-950">
              <img src="${imgUrl}" alt="${p.name}" class="w-full h-full object-cover opacity-90" />
              <span class="absolute top-3 left-3 text-[11px] font-bold px-2.5 py-1 rounded-lg bg-slate-950/90 text-slate-200 border border-slate-700">
                Lote #${batch}
              </span>
              <span class="absolute top-3 right-3 text-[11px] font-bold px-2.5 py-1 rounded-lg ${isClosed ? 'bg-emerald-600 text-white' : 'bg-blue-600 text-white'}">
                ${isClosed ? 'LOTE FECHADO (10/10)' : `${count}/10 Reservados`}
              </span>
            </div>

            <div class="p-4 flex-1 flex flex-col justify-between space-y-4">
              <div>
                ${p.category ? `<span class="text-[11px] text-blue-400 font-semibold uppercase tracking-wider">${p.category}</span>` : ''}
                <h3 class="font-bold text-white text-base leading-snug mt-0.5">${p.name}</h3>

                <div class="mt-3 grid grid-cols-2 gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800/80">
                  <div>
                    <p class="text-[11px] text-slate-400">Sinal Reserva</p>
                    <p class="font-extrabold text-blue-400 text-sm">${formatBRL(p.depositPrice)}</p>
                  </div>
                  <div>
                    <p class="text-[11px] text-slate-400">Valor Cheio</p>
                    <p class="font-extrabold text-white text-sm">${formatBRL(p.fullPrice)}</p>
                  </div>
                </div>
              </div>

              <div>
                <div class="flex justify-between text-xs mb-1.5">
                  <span class="text-slate-400">${isClosed ? 'Meta atingida!' : `Faltam ${10 - count} peças`}</span>
                  <span class="font-bold ${isClosed ? 'text-emerald-400' : 'text-blue-400'}">${count}/10</span>
                </div>
                <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                  <div class="h-full ${isClosed ? 'bg-emerald-500' : 'bg-blue-500'} transition-all duration-300" style="width: ${pct}%"></div>
                </div>

                ${batchRes.length > 0 ? `
                  <div class="mt-3 pt-2.5 border-t border-slate-800/80">
                    <p class="text-[11px] text-slate-400 mb-1">Participantes do Lote #${batch}:</p>
                    <div class="flex flex-wrap gap-1">
                      ${batchRes.map((r, i) => `
                        <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300">
                          #${i + 1} ${r.clientName.split(' ')[0]}
                        </span>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}

                <button ${isClosed ? 'disabled' : `onclick="openReserveModal('${p.id}')"`}
                  class="mt-4 w-full py-2.5 rounded-xl font-semibold text-xs sm:text-sm transition ${
                    isClosed
                      ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-700/50 cursor-not-allowed'
                      : 'bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/20'
                  }">
                  ${isClosed ? 'Fechado — Valor Cheio Liberado aos 10' : `Reservar Vaga (${formatBRL(p.depositPrice)})`}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    };

    window.openReserveModal = function (productId) {
      const p = products.find(item => item.id === productId);
      if (!p) return;
      const batch = p.currentBatch || 1;
      const count = getBatchReservations(p.id, batch).length;
      if (count >= 10) {
        alert("Este lote acabou de atingir 10/10 reservas!");
        return;
      }

      document.getElementById("modalProductId").value = p.id;
      document.getElementById("modalBatchTag").textContent = `Lote #${batch}`;
      document.getElementById("modalProductName").textContent = p.name;
      document.getElementById("modalDepositPrice").textContent = formatBRL(p.depositPrice);
      document.getElementById("modalFullPrice").textContent = formatBRL(p.fullPrice);
      document.getElementById("modalSpotsLeft").textContent = `${10 - count} de 10 vagas`;

      const pixBox = document.getElementById("pixInstructionBox");
      if (storeConfig.pixKey) {
        pixBox.classList.remove("hidden");
        document.getElementById("displayPixKey").textContent = storeConfig.pixKey;
      } else {
        pixBox.classList.add("hidden");
      }

      document.getElementById("reserveModal").classList.remove("hidden");
    };

    window.closeReserveModal = () => document.getElementById("reserveModal").classList.add("hidden");

    window.submitReservation = async function (e) {
      e.preventDefault();
      const btn = document.getElementById("confirmReserveBtn");
      const productId = document.getElementById("modalProductId").value;
      const clientName = document.getElementById("clientName").value.trim();
      const clientWhatsapp = document.getElementById("clientWhatsapp").value.replace(/\D/g, "");

      if (!clientName || clientWhatsapp.length < 10) {
        alert("Preencha seu nome e WhatsApp com DDD.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Verificando vaga...";

      try {
        const prodRef = doc(db, "products", productId);
        let assignedPosition = 0;
        let assignedBatch = 1;
        let productObj = null;

        await runTransaction(db, async (transaction) => {
          const prodSnap = await transaction.get(prodRef);
          if (!prodSnap.exists()) throw new Error("Produto não encontrado.");
          productObj = prodSnap.data();
          assignedBatch = productObj.currentBatch || 1;
          const currentCount = productObj.reservedCount || 0;

          if (currentCount >= 10) {
            throw new Error("Que pena! A 10ª vaga acabou de ser preenchida por outro cliente.");
          }

          assignedPosition = currentCount + 1;
          transaction.update(prodRef, { reservedCount: assignedPosition });

          const newResRef = doc(collection(db, "reservations"));
          transaction.set(newResRef, {
            productId,
            productName: productObj.name,
            batch: assignedBatch,
            position: assignedPosition,
            clientName,
            clientWhatsapp,
            depositPrice: Number(productObj.depositPrice),
            fullPrice: Number(productObj.fullPrice),
            paidFull: false,
            createdAtMs: Date.now(),
            createdAt: serverTimestamp()
          });
        });

        document.getElementById("reserveForm").reset();
        closeReserveModal();

        if (assignedPosition === 10) {
          alert(`PARABÉNS ${clientName}! Você garantiu a 10ª e última vaga (#10/10) de "${productObj.name}"! O lote fechou e o valor cheio já está liberado.`);
        } else {
          alert(`Reserva #${assignedPosition}/10 confirmada para "${productObj.name}"! Assim que completar 10 peças, entraremos em contato no seu WhatsApp para o fechamento.`);
        }
      } catch (err) {
        alert(err.message || "Erro ao registrar reserva.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Confirmar Minha Reserva (1 Peça)";
      }
    };

    window.addSingleProduct = async function (e) {
      e.preventDefault();
      await addDoc(collection(db, "products"), {
        name: document.getElementById("prodName").value.trim(),
        depositPrice: Number(document.getElementById("prodDeposit").value),
        fullPrice: Number(document.getElementById("prodFull").value),
        category: document.getElementById("prodCategory").value.trim() || "Geral",
        image: document.getElementById("prodImage").value.trim(),
        currentBatch: 1,
        reservedCount: 0,
        createdAt: serverTimestamp()
      });
      e.target.reset();
      alert("Produto cadastrado!");
    };

    window.importBulkProducts = async function () {
      const raw = document.getElementById("bulkInput").value.trim();
      if (!raw) return;
      const lines = raw.split("\n").filter(l => l.trim());
      let count = 0;

      for (const line of lines) {
        const [name, dep, full, cat, img] = line.split(";").map(s => s.trim());
        if (!name || isNaN(Number(dep)) || isNaN(Number(full))) continue;
        await addDoc(collection(db, "products"), {
          name,
          depositPrice: Number(dep),
          fullPrice: Number(full),
          category: cat || "Geral",
          image: img || "",
          currentBatch: 1,
          reservedCount: 0,
          createdAt: serverTimestamp()
        });
        count++;
      }
      document.getElementById("bulkInput").value = "";
      alert(`${count} produtos importados com sucesso!`);
    };

    window.openNextBatch = async function (productId, currentBatch) {
      if (!confirm(`Abrir o Lote #${currentBatch + 1} para este produto? As reservas do lote anterior continuam salvas no histórico.`)) return;
      await updateDoc(doc(db, "products", productId), {
        currentBatch: currentBatch + 1,
        reservedCount: 0
      });
    };

    window.deleteProduct = async function (productId) {
      if (!confirm("Excluir este produto?")) return;
      await deleteDoc(doc(db, "products", productId));
    };

    window.togglePaidFull = async function (resId, currentStatus) {
      await updateDoc(doc(db, "reservations", resId), { paidFull: !currentStatus });
    };

    window.renderAdminProducts = function () {
      const tbody = document.getElementById("adminProductsTable");
      if (!tbody) return;
      tbody.innerHTML = products.map(p => {
        const batch = p.currentBatch || 1;
        const count = getBatchReservations(p.id, batch).length;
        return `
          <tr>
            <td class="p-3 font-medium text-white">${p.name}</td>
            <td class="p-3 text-slate-400">${p.category || '-'}</td>
            <td class="p-3 text-blue-400">${formatBRL(p.depositPrice)}</td>
            <td class="p-3 text-white">${formatBRL(p.fullPrice)}</td>
            <td class="p-3">
              <span class="px-2 py-0.5 rounded text-[11px] font-bold ${count >= 10 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-300'}">
                Lote #${batch} (${count}/10)
              </span>
            </td>
            <td class="p-3 text-right space-x-2">
              ${count >= 10 ? `<button onclick="openNextBatch('${p.id}', ${batch})" class="px-2.5 py-1 rounded bg-blue-600 text-white text-[11px] font-semibold">Abrir Lote #${batch + 1}</button>` : ''}
              <button onclick="deleteProduct('${p.id}')" class="px-2.5 py-1 rounded bg-red-950 text-red-400 text-[11px]">Excluir</button>
            </td>
          </tr>
        `;
      }).join("");
    };

    window.renderAdminClosings = function () {
      const container = document.getElementById("adminClosingsList");
      if (!container) return;
      const filter = document.getElementById("adminClosingFilter").value;

      const list = products.filter(p => {
        const batch = p.currentBatch || 1;
        const count = getBatchReservations(p.id, batch).length;
        if (filter === "CLOSED") return count >= 10;
        if (filter === "OPEN") return count < 10;
        return true;
      });

      if (list.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500">Nenhum lote encontrado neste filtro.</p>`;
        return;
      }

      container.innerHTML = list.map(p => {
        const batch = p.currentBatch || 1;
        const top10 = getBatchReservations(p.id, batch);
        const isClosed = top10.length >= 10;
        const remaining = Number(p.fullPrice) - Number(p.depositPrice);

        return `
          <div class="bg-slate-950 border ${isClosed ? 'border-emerald-500/40' : 'border-slate-800'} rounded-xl p-4">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-800">
              <div>
                <span class="text-xs font-bold ${isClosed ? 'text-emerald-400' : 'text-blue-400'}">
                  ${isClosed ? '✅ FECHADO (10/10) — COBRAR VALOR CHEIO' : `⏳ EM ANDAMENTO (${top10.length}/10)`}
                </span>
                <h4 class="font-bold text-white text-sm">${p.name} (Lote #${batch})</h4>
              </div>
              <div class="text-right text-xs">
                <span class="text-slate-400">Cheio: <strong class="text-white">${formatBRL(p.fullPrice)}</strong></span> |
                <span class="text-slate-400">Restante p/ cobrar: <strong class="text-emerald-400">${formatBRL(remaining)}</strong></span>
              </div>
            </div>

            ${top10.length === 0 ? `<p class="text-xs text-slate-500 pt-3">Nenhuma reserva neste lote ainda.</p>` : `
              <div class="mt-3 divide-y divide-slate-900">
                ${top10.map((r, idx) => {
                  const msg = encodeURIComponent(
                    `Olá ${r.clientName}! Você foi o #${idx + 1} dos 10 primeiros no rateio de *${p.name}* (Lote #${batch})!\n\n` +
                    `O lote fechou 10/10! Segue o resumo para pagamento do valor cheio:\n` +
                    `• Valor Cheio: ${formatBRL(p.fullPrice)}\n` +
                    `• Sinal já reservado: -${formatBRL(p.depositPrice)}\n` +
                    `• *Saldo Restante a Pagar: ${formatBRL(remaining)}*\n` +
                    (storeConfig.pixKey ? `\nChave PIX: ${storeConfig.pixKey}` : '')
                  );
                  return `
                    <div class="py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
                      <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-slate-800 font-bold text-slate-200 flex items-center justify-center">#${idx + 1}</span>
                        <div>
                          <p class="font-semibold text-white">${r.clientName}</p>
                          <p class="text-slate-400">WhatsApp: ${r.clientWhatsapp}</p>
                        </div>
                      </div>
                      <div class="flex items-center gap-2">
                        <button onclick="togglePaidFull('${r.id}', ${!!r.paidFull})"
                          class="px-2.5 py-1 rounded font-semibold ${r.paidFull ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-300'}">
                          ${r.paidFull ? 'Pago Integral ✓' : 'Marcar Pago'}
                        </button>
                        <a href="https://wa.me/55${r.clientWhatsapp}?text=${msg}" target="_blank"
                          class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-semibold">
                          Cobrar no WhatsApp
                        </a>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            `}
          </div>
        `;
      }).join("");
    };

    window.saveSettings = async function () {
      const pixKey = document.getElementById("settingPixKey").value.trim();
      const storeWhatsapp = document.getElementById("settingStoreWhatsapp").value.trim();
      const newPass = document.getElementById("settingAdminPass").value.trim();

      const payload = { pixKey, storeWhatsapp };
      if (newPass) payload.adminPass = newPass;

      await setDoc(doc(db, "config", "store"), payload, { merge: true });
      alert("Configurações salvas no banco de dados!");
    };
  </script>
</body>
</html>
